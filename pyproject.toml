[project]
name = "rankless"
version = "0.1.0"
description = "a Large-scale Scholarly Data Exploration Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.61",
    "ccl-science-data",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.8",
    "pandas[aws, parquet]>=3.0.1",
    "polars>=1.12.0",
    "psycopg>=3.3.3",
    "psycopg2>=2.9.11",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "shackleton>=1.2.0",
    "sqlalchemy>=2.0.46",
    "sqlmermaid>=0.1.4",
]

[tool.uv.sources]
# `libs/ccl-science-data` is populated by `make bootstrap` (cloned from
# https://github.com/CenterForCollectiveLearning/science-data). Symlink an
# existing checkout there if you already have one.
ccl-science-data = { path = "libs/ccl-science-data", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
