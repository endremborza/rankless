# Public MCP endpoint: a `location` for the backend (api/alpha-api) server
# block, proxying to the local mcp-server unit. Buffering off for SSE/streaming.
# The forwarded Host must be in the unit's MCP_PUBLIC_HOSTS; `apilimit` is the
# per-client API zone the deploy conf defines (keyed on the visitor behind Cloudflare).
location /mcp {
    proxy_pass http://127.0.0.1:{{ mcp_port }}/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    {{ api_limit_req }}
}
