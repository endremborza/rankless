# Perf comparisons for `uv run -m pyscripts compare-branch`.
# Every key besides name/a/b is a `Settings` field of branch_comparison.py and defaults there;
# an optional [defaults] table overrides them for every comparison, and each [[comparison]]
# may override any of them.
# `a` (candidate) and `b` (baseline) are any git ref: tag, branch, or commit-ish.
# See docs/benchmarking.md.

[[comparison]]
name = "heap-to-sort"
a = "1c01d0178"                                      # MinHeap = Vec + sort_unstable
b = "1c01d0178~1"                                    # BinaryHeap<Reverse<T>> baseline
